plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
}


android {
    namespace "fambox.pro"
    compileSdkVersion 35
    defaultConfig {
        applicationId "fambox.pro"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 67
        versionName "2.9.12"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled true

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.rates_count
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        buildConfig true
        viewBinding true
    }
    bundle {
        language {
            // Specifies that the app bundle should not support
            // configuration APKs for language resources. These
            // resources are instead packaged with each base and
            // dynamic feature APK.
            enableSplit = false
        }
    }

    flavorDimensions "environment"

    productFlavors {
        prod {
            dimension = "environment"
            buildConfigField "String", "BASE_URL", "\"https://dashboard.safeyou.space\""
            buildConfigField "String", "BASE_SOCKET_URL", "\"https://dashboard.safeyou.space\""
            buildConfigField "String", "BASE_SOCKET_URL_GEO", "\"https://dashboard.safeyou.space\""
            buildConfigField "String", "BASE_SOCKET_URL_IRQ", "\"https://dashboard.safeyou.space\""
            buildConfigField "String", "BASE_SOCKET_URL_ZWE", "\"https://dashboard.safeyou.space\""
            buildConfigField "String", "BASE_SOCKET_URL_ROM", "\"https://romania.safeyou.space\""
            buildConfigField "String", "BASE_SOCKET_URL_USA", "\"https://usa.safeyou.space\""
            buildConfigField "String", "BASE_SOCKET_URL_POL", "\"https://romania.safeyou.space\""

        }
        qa {
            dimension = "environment"
            buildConfigField "String", "BASE_URL", "\"https://qa.sydeveloper.com\""
            buildConfigField "String", "BASE_SOCKET_URL", "\"https://qa.sydeveloper.com\""
            buildConfigField "String", "BASE_SOCKET_URL_GEO", "\"https://qa.sydeveloper.com\""
            buildConfigField "String", "BASE_SOCKET_URL_IRQ", "\"https://qa.sydeveloper.com\""
            buildConfigField "String", "BASE_SOCKET_URL_ZWE", "\"https://qa.sydeveloper.com\""
            buildConfigField "String", "BASE_SOCKET_URL_ROM", "\"https://qa.sydeveloper.com\""
            buildConfigField "String", "BASE_SOCKET_URL_USA", "\"https://qa.sydeveloper.com\""
            buildConfigField "String", "BASE_SOCKET_URL_POL", "\"https://qa.sydeveloper.com\""

        }
        dev {
            dimension = "environment"
            buildConfigField "String", "BASE_URL", "\"https://sydeveloper.com\""
            buildConfigField "String", "BASE_SOCKET_URL", "\"https://sydeveloper.com\""
            buildConfigField "String", "BASE_SOCKET_URL_GEO", "\"https://sydeveloper.com\""
            buildConfigField "String", "BASE_SOCKET_URL_IRQ", "\"https://sydeveloper.com\""
            buildConfigField "String", "BASE_SOCKET_URL_ZWE", "\"https://sydeveloper.com\""
            buildConfigField "String", "BASE_SOCKET_URL_ROM", "\"https://sydeveloper.com\""
            buildConfigField "String", "BASE_SOCKET_URL_USA", "\"https://sydeveloper.com\""
            buildConfigField "String", "BASE_SOCKET_URL_POL", "\"https://sydeveloper.com\""

        }
    }
}

def jdkModuleExports = [
        '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED',
        '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED'
]

tasks.withType(JavaCompile).configureEach {
    options.fork = true
    options.forkOptions.jvmArgs += jdkModuleExports
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    // RxJava
    implementation 'io.reactivex.rxjava2:rxjava:2.2.6'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.jakewharton.retrofit:retrofit2-rxjava2-adapter:1.0.0'
    //glide
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp:5.0.0-alpha.11'
    //butter knife
    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'
    // responsive sizes
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'com.intuit.ssp:ssp-android:1.0.6'
    //pass view
    implementation 'in.arjsna:passcodeview:1.2.1'
    // implementation
    implementation project(path: ':audiowaveview')
    // chat
    implementation project(path: ':chatkit')
    // kotlin implementation
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1"
    //noinspection GradleDependency
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    // circle Image view
    implementation 'de.hdodenhof:circleimageview:3.0.0'
    // loading dialog
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'

    //Open Street Map
    implementation 'org.osmdroid:osmdroid-android:6.1.10'

    // image piker
    implementation 'com.github.maayyaannkk:ImagePicker:1.2.5'
    // permission checker
    implementation 'com.nabinbhandari.android:permissions:4.0.0'
    // LocationManagerCompat is provided by androidx.core.
    // socket IO
    implementation 'io.socket:socket.io-client:2.0.1'
    // phone number parser
    implementation 'io.michaelrocks:libphonenumber-android:8.12.19-2'
    // sesrch view
    implementation project(path: ':materialsearchview')
    implementation project(path: ':SpinnerDatePickerLib')
    // horizontal progress
    implementation 'me.zhanghai.android.materialprogressbar:library:1.6.1'
    //lombok
    implementation 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    // badge
    implementation 'q.rorbin:badgeview:1.1.3'
    // country phone code picker
    implementation 'com.hbb20:ccp:2.5.0'
    // image pic
    implementation  'com.fxn769:pix:1.5.6'
    // record view
    //chip views
    implementation("com.robertlevonyan.view:MaterialChipView:3.0.2")
    // spinner view
    implementation "com.github.skydoves:powerspinner:1.1.9"
    // Rounded Image View
    implementation 'com.makeramen:roundedimageview:2.3.0'
    // time difference calculator
    implementation 'com.github.kevinsawicki:timeago:1.0.1'

    implementation 'androidx.webkit:webkit:1.7.0'

}
repositories {
    mavenCentral()
}
